name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  FORCE_COLOR: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ========================================
  # Rust Tests & Checks
  # ========================================
  rust-tests:
    name: Rust Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --check

      - name: Check Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Tests
        run: cargo test --workspace

  # ========================================
  # TUI Tests
  # ========================================
  tui-tests:
    name: TUI Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tui/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: tui

      - name: Run Tests
        run: npm test
        working-directory: tui

      - name: Type Check
        run: npm run typecheck
        working-directory: tui

  # ========================================
  # Build Check
  # ========================================
  build-check:
    name: Build Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Rust
        run: cargo build --workspace --release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tui/package-lock.json

      - name: Install TUI Dependencies
        run: npm ci
        working-directory: tui

      - name: Build TUI
        run: npm run build
        working-directory: tui

      - name: Copy TUI to memory-bank
        run: |
          mkdir -p memory-bank/dist
          cp -r tui/dist/* memory-bank/dist/

      - name: Validate npm package structure
        run: |
          echo "=== Package files ==="
          ls -la memory-bank/
          echo ""
          echo "=== Checking required files ==="
          test -f memory-bank/package.json && echo "✓ package.json" || echo "✗ package.json missing"
          test -f memory-bank/README.md && echo "✓ README.md" || echo "✗ README.md missing"
          test -f memory-bank/dist/cli.js && echo "✓ dist/cli.js" || echo "✗ dist/cli.js missing"
          test -f memory-bank/scripts/postinstall.js && echo "✓ scripts/postinstall.js" || echo "✗ scripts/postinstall.js missing"
          test -f memory-bank/.npmignore && echo "✓ .npmignore" || echo "✗ .npmignore missing"
          echo ""
          echo "=== Package info ==="
          cat memory-bank/package.json | grep -E '"name"|"version"'
