name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  verify-main:
    name: Verify tag is on main
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch main
        run: git fetch origin main --no-tags

      - name: Ensure tagged commit is reachable from main
        run: |
          set -eu
          TAG_SHA="${GITHUB_SHA}"
          if ! git merge-base --is-ancestor "${TAG_SHA}" "origin/main"; then
            echo "Refusing to release: tagged commit ${TAG_SHA} is not reachable from origin/main." >&2
            exit 1
          fi

  validate:
    name: Validate release commit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: make fmt-check

      - name: Cargo check
        run: make check

      - name: Validate test suite
        run: make test-ci

  # ========================================
  # Build TUI
  # ========================================
  build-tui:
    name: Build TUI
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tui/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: tui

      - name: Run Tests
        run: npm test
        working-directory: tui

      - name: Build TUI
        run: npm run build
        working-directory: tui

      - name: Upload TUI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tui-dist
          path: tui/dist/**

  build:
    name: Build ${{ matrix.target }}
    needs:
      - verify-main
      - validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            artifact_name: memory-bank-server-darwin-arm64
            platform_key: darwin-arm64
          - runner: macos-14
            target: x86_64-apple-darwin
            artifact_name: memory-bank-server-darwin-x64
            platform_key: darwin-x64
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact_name: memory-bank-server-linux-x64
            platform_key: linux-x64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: memory-bank-server-linux-arm64
            platform_key: linux-arm64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: memory-bank-server-win32-x64.exe
            platform_key: win32-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --workspace --release --target ${{ matrix.target }}

      - name: Prepare Binaries
        shell: bash
        run: |
          mkdir -p dist/binaries
          EXT=""
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            EXT=".exe"
          fi
          TARGET="${{ matrix.target }}"
          PLATFORM_KEY="${{ matrix.platform_key }}"
          
          # Copy all binaries with platform-specific names
          cp "target/${TARGET}/release/memory-bank-server${EXT}" "dist/binaries/memory-bank-server-${PLATFORM_KEY}${EXT}"
          cp "target/${TARGET}/release/mb${EXT}" "dist/binaries/mb-${PLATFORM_KEY}${EXT}"
          cp "target/${TARGET}/release/memory-bank-hook${EXT}" "dist/binaries/memory-bank-hook-${PLATFORM_KEY}${EXT}" 2>/dev/null || true
          cp "target/${TARGET}/release/memory-bank-mcp-proxy${EXT}" "dist/binaries/memory-bank-mcp-proxy-${PLATFORM_KEY}${EXT}" 2>/dev/null || true
          
          chmod +x dist/binaries/*${EXT} 2>/dev/null || true

      - name: Upload Binary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.platform_key }}
          path: dist/binaries/*

      - name: Package release tarball
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          STAGE_DIR="dist/memory-bank"
          BIN_DIR="${STAGE_DIR}/bin"
          CONFIG_DIR="${STAGE_DIR}/config"
          OPENCODE_DIR="${STAGE_DIR}/integrations/opencode"
          OPENCLAW_DIR="${STAGE_DIR}/integrations/openclaw"

          rm -rf dist/memory-bank
          mkdir -p "${BIN_DIR}" "${CONFIG_DIR}" "${OPENCODE_DIR}" "${OPENCLAW_DIR}"

          cp "target/${TARGET}/release/mb" "${BIN_DIR}/mb"
          cp "target/${TARGET}/release/memory-bank-server" "${BIN_DIR}/memory-bank-server"
          cp "target/${TARGET}/release/memory-bank-hook" "${BIN_DIR}/memory-bank-hook"
          cp "target/${TARGET}/release/memory-bank-mcp-proxy" "${BIN_DIR}/memory-bank-mcp-proxy"

          chmod +x "${BIN_DIR}/mb" \
            "${BIN_DIR}/memory-bank-server" \
            "${BIN_DIR}/memory-bank-hook" \
            "${BIN_DIR}/memory-bank-mcp-proxy"

          cp ".opencode/plugins/memory-bank.js" "${OPENCODE_DIR}/memory-bank.js"
          cp -R ".openclaw/extensions/memory-bank" "${OPENCLAW_DIR}/memory-bank"
          cp "config/setup-model-catalog.json" "${CONFIG_DIR}/setup-model-catalog.json"

          tar -C "${STAGE_DIR}" -czf "memory-bank-${TARGET}.tar.gz" .

      - name: Upload packaged tarball
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: memory-bank-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release & npm
    runs-on: ubuntu-24.04
    needs: [build, build-tui]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          pattern: release-*
          merge-multiple: true

      - name: Download TUI artifact
        uses: actions/download-artifact@v4
        with:
          name: tui-dist
          path: tui-dist

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries
          pattern: binaries-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -eu
          cd dist-artifacts
          sha256sum memory-bank-*.tar.gz > SHA256SUMS 2>/dev/null || true

      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          gh release create "${TAG}" \
            --draft \
            --title "${TAG}" \
            --generate-notes

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          gh release upload "${TAG}" dist-artifacts/memory-bank-*.tar.gz dist-artifacts/SHA256SUMS binaries/* --clobber || true

      # ========================================
      # Publish to npm
      # ========================================
      - name: Setup Node.js for npm
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Prepare npm package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          
          # Create package structure
          mkdir -p memory-bank-pkg/{dist,scripts,binaries}
          
          # Copy TUI dist
          cp -r tui-dist/* memory-bank-pkg/dist/ 2>/dev/null || true
          
          # Copy all binaries (server, mb, hook, mcp-proxy)
          cp binaries/memory-bank-server-* memory-bank-pkg/binaries/ 2>/dev/null || true
          cp binaries/mb-* memory-bank-pkg/binaries/ 2>/dev/null || true
          cp binaries/memory-bank-hook-* memory-bank-pkg/binaries/ 2>/dev/null || true
          cp binaries/memory-bank-mcp-proxy-* memory-bank-pkg/binaries/ 2>/dev/null || true
          
          # List what we have
          echo "Binaries in package:"
          ls -la memory-bank-pkg/binaries/
          
          # Copy scripts
          cp memory-bank/scripts/*.js memory-bank-pkg/scripts/
          
          # Copy README
          cp memory-bank/README.md memory-bank-pkg/
          
          # Copy package.json and update version
          cp memory-bank/package.json memory-bank-pkg/
          sed -i "s/\"version\": \"[0-9].[0-9].[0-9]\"/\"version\": \"$VERSION\"/" memory-bank-pkg/package.json
          
          # Copy .npmignore
          cp memory-bank/.npmignore memory-bank-pkg/
          
          # Show final package info
          echo "Package ready for @anaxsouza/memory-bank v$VERSION"
          cat memory-bank-pkg/package.json | grep -E '"name"|"version"'

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd memory-bank-pkg
          npm publish --access public || echo "npm publish failed - may need to setup NPM_TOKEN secret"

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          gh release edit "${TAG}" --draft=false
